logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: baimiao
  password: 12345678
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: baimiao
  password: 12345678
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: deepseek-flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.deepseek.com/v1
  # 管理员可在前端切换的模型列表，运行时切换结果持久化到 logs/model_setting.json
  available_models:
    - deepseek-flash
    - deepseek-v4-pro

jwt:
  secret_key: ${oc.env:JWT_SECRET_KEY}
  algorithm: HS256
  expire_minutes: 1440

agent:
  max_sql_retries: 3
  max_analysis_loops: 6

oss:
  endpoint: ${oc.env:OSS_ENDPOINT,}
  access_key_id: ${oc.env:OSS_ACCESS_KEY_ID,}
  access_key_secret: ${oc.env:OSS_ACCESS_KEY_SECRET,}
  bucket: ${oc.env:OSS_BUCKET,}

model_price:
  source_url: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
  aliases: {}
  fallback:
    deepseek-v4-pro:
      input_cache_miss_off_peak: 4.5
      input_cache_miss_peak: 9.0
      output_off_peak: 13.5
      output_peak: 27.0
    deepseek-flash:
      input_cache_miss_off_peak: 1.0
      input_cache_miss_peak: 2.0
      output_off_peak: 4.0
      output_peak: 8.0
